# Images are pinned to multi-arch index digests (verified linux/amd64 + linux/arm64).
# Upgrading a digest is a deliberate change; apt and the Python build backend are not locked.
# No service builds here: release users pull PVG_IMAGE, source users add compose.build.yml.
# Nothing is required at parse time (no `:?` substitutions) so the init service works before .env exists;
# the services validate their own configuration at startup instead.
services:
  persona-vault-gateway:
    image: "${PVG_IMAGE:-persona-vault-gateway:local}"
    container_name: persona-vault-gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_BIND_ADDR:-127.0.0.1}:${GATEWAY_HOST_PORT:-18080}:8000"
    volumes:
      - persona-vault:/vault
      - persona-vault-gateway-data:/data
    environment:
      VAULT_DIR: /vault
      DB_PATH: /data/gateway.db
      HOST_ID: "${HOST_ID:-persona-vault-gateway}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
      CLOUDFLARE_ACCOUNT_ID: "${CLOUDFLARE_ACCOUNT_ID:-}"
      CLOUDFLARE_API_TOKEN: "${CLOUDFLARE_API_TOKEN:-}"
      EMBEDDING_PROVIDER: "${EMBEDDING_PROVIDER:-none}"
      EMBEDDING_MODEL: "${EMBEDDING_MODEL:-@cf/qwen/qwen3-embedding-0.6b}"
      EMBEDDING_BATCH_SIZE: "${EMBEDDING_BATCH_SIZE:-32}"
      QDRANT_URL: "http://qdrant:6333"
      QDRANT_COLLECTION: "${QDRANT_COLLECTION:-persona_vault}"
      # Uvicorn trusts X-Forwarded-* only from these exact IPs; set your reverse proxy's address, never "*".
      FORWARDED_ALLOW_IPS: "${FORWARDED_ALLOW_IPS:-127.0.0.1}"
    depends_on:
      # Healthy only after the sync service finished its INITIAL clone/checkout (marker below).
      persona-vault-sync:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3).read()"
      interval: 30s
      timeout: 5s
      retries: 3

  # Only for semantic search: COMPOSE_PROFILES=semantic. The Gateway does not depend on it.
  qdrant:
    profiles: [semantic]
    image: qdrant/qdrant@sha256:75eab8c4ba42096724fdcfde8b4de0b5713d529dde32f285a1f86fdcb2c9e50c
    container_name: persona-vault-qdrant
    restart: unless-stopped
    volumes:
      - persona-vault-qdrant:/qdrant/storage

  persona-vault-sync:
    image: alpine/git@sha256:fac7bc2c12aa52bff1c78a26359990e149954a60cdd5d6e20e7e009666c73e0a
    container_name: persona-vault-sync
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -ec
      - |
        rm -f /tmp/pv-sync-clone-ready
        git config --global --add safe.directory /vault
        git config --global user.name "PersonaVault Sync"
        git config --global user.email "persona-vault-sync@localhost"
        sync_blocked() {
          blocked=""
          for marker in rebase-merge rebase-apply MERGE_HEAD CHERRY_PICK_HEAD REVERT_HEAD; do
            if [ -e "$$(git rev-parse --git-path "$$marker")" ]; then
              blocked="$$blocked $$marker"
            fi
          done
          unmerged="$$(git ls-files --unmerged | cut -f2 | sort -u | head -n 20)"
          if [ -z "$$blocked" ] && [ -z "$$unmerged" ]; then
            return 1
          fi
          {
            echo "persona-vault-sync: BLOCKED, unresolved git state in /vault; not running add/commit/pull/push."
            [ -z "$$blocked" ] || echo "  in-progress operation:$$blocked"
            [ -z "$$unmerged" ] || { echo "  unmerged files (first 20):"; echo "$$unmerged" | sed 's/^/    /'; }
            echo "  Resolve manually in /vault (git status), then sync resumes on its own."
          } >&2
          return 0
        }
        if [ ! -d /vault/.git ]; then
          git clone "$${VAULT_REPO_SSH_URL:?set VAULT_REPO_SSH_URL}" /vault
        fi
        if [ "$$(git -C /vault rev-parse --is-inside-work-tree 2>/dev/null)" != true ] ||
           [ -n "$$(git -C /vault rev-parse --show-cdup 2>/dev/null)" ]; then
          echo "persona-vault-sync: /vault is not a usable git work tree; initial clone not ready." >&2
          exit 1
        fi
        # Initial clone/checkout finished; releases the Gateway start only (not a sync atomicity promise).
        : > /tmp/pv-sync-clone-ready
        while true; do
          cd /vault
          if sync_blocked; then
            sleep "$${VAULT_SYNC_INTERVAL_SECONDS:-300}"
            continue
          fi
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "Sync vault $$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          fi

          git pull --rebase --autostash
          if sync_blocked; then
            sleep "$${VAULT_SYNC_INTERVAL_SECONDS:-300}"
            continue
          fi
          git push
          sleep "$${VAULT_SYNC_INTERVAL_SECONDS:-300}"
        done
    environment:
      GIT_SSH_COMMAND: "ssh -i /run/secrets/persona_vault_sync_key -o IdentitiesOnly=yes -o UserKnownHostsFile=/run/secrets/github_known_hosts"
      VAULT_REPO_SSH_URL: "${VAULT_REPO_SSH_URL:-}"
      VAULT_SYNC_INTERVAL_SECONDS: "${VAULT_SYNC_INTERVAL_SECONDS:-300}"
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/pv-sync-clone-ready"]
      interval: 2s
      timeout: 3s
      start_period: 120s
      retries: 30
    volumes:
      - persona-vault:/vault
    secrets:
      - source: persona_vault_sync_key
        target: persona_vault_sync_key
      - source: github_known_hosts
        target: github_known_hosts

  # First-run setup: docker compose run --rm persona-vault-init [--check]. Same image, project dir at /setup.
  persona-vault-init:
    profiles: [tools]
    image: "${PVG_IMAGE:-persona-vault-gateway:local}"
    entrypoint: [python, -m, gateway.bootstrap]
    restart: "no"
    stdin_open: true
    tty: true
    volumes:
      - .:/setup

secrets:
  persona_vault_sync_key:
    file: ./secrets/persona_vault_sync
  github_known_hosts:
    file: ./secrets/github_known_hosts

volumes:
  persona-vault:
  persona-vault-gateway-data:
  persona-vault-qdrant:
