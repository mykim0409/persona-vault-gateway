# One service: the Gateway with the browser setup wizard (/setup). Standalone: download this one file and run
#   docker compose up -d
# then open http://127.0.0.1:18080/setup. No .env, secret file, Git host key or Cloudflare account is needed up front.
# Release downloads pin PVG_IMAGE to a multi-arch image digest; a source checkout uses a local build tag instead
# (docker compose -f compose.yml -f compose.build.yml build). Qdrant is a pinned multi-arch index digest too;
# upgrading a digest is a deliberate change, and apt and the Python build backend are not locked.
# Nothing is required at parse time (no `:?` substitutions); the Gateway validates its own configuration at startup.
services:
  persona-vault-gateway:
    image: "${PVG_IMAGE:-persona-vault-gateway:local}"
    container_name: persona-vault-gateway
    restart: unless-stopped
    command: [python, -m, gateway.server]
    ports:
      - "${GATEWAY_BIND_ADDR:-127.0.0.1}:${GATEWAY_HOST_PORT:-18080}:8000"
    volumes:
      # SQLite, the Vault clone (vault/) and the private setup state (setup/, including the deploy key).
      - persona-vault-data:/data
    environment:
      PORT: "8000"
      PVG_DATA_DIR: /data
      VAULT_DIR: /data/vault
      DB_PATH: /data/gateway.db
      # Optional first-use claim token for /setup (20-200 printable ASCII characters, no spaces). When it is empty
      # the Gateway generates one and prints it once to the container log (docker compose logs).
      PVG_SETUP_TOKEN: "${PVG_SETUP_TOKEN:-}"
      # Set true only when browsers reach the Gateway over HTTPS through a proxy it does not trust: keeps admin cookies Secure.
      PVG_SECURE_COOKIES: "${PVG_SECURE_COOKIES:-false}"
      VAULT_SYNC_INTERVAL_SECONDS: "${VAULT_SYNC_INTERVAL_SECONDS:-300}"
      HOST_ID: "${HOST_ID:-persona-vault-gateway}"
      CLOUDFLARE_ACCOUNT_ID: "${CLOUDFLARE_ACCOUNT_ID:-}"
      CLOUDFLARE_API_TOKEN: "${CLOUDFLARE_API_TOKEN:-}"
      EMBEDDING_PROVIDER: "${EMBEDDING_PROVIDER:-none}"
      EMBEDDING_MODEL: "${EMBEDDING_MODEL:-@cf/qwen/qwen3-embedding-0.6b}"
      EMBEDDING_BATCH_SIZE: "${EMBEDDING_BATCH_SIZE:-32}"
      QDRANT_URL: "http://qdrant:6333"
      QDRANT_COLLECTION: "${QDRANT_COLLECTION:-persona_vault}"
      # Uvicorn trusts X-Forwarded-* only from these exact IPs; set your reverse proxy's address, never "*".
      FORWARDED_ALLOW_IPS: "${FORWARDED_ALLOW_IPS:-127.0.0.1}"
    healthcheck:
      # Liveness: 200 before the setup is claimed. /readyz stays 503 until the Vault is connected, so it is not used here.
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).read()"
      interval: 30s
      timeout: 5s
      retries: 3

  # Only for semantic search: COMPOSE_PROFILES=semantic. The Gateway does not depend on it.
  qdrant:
    profiles: [semantic]
    image: qdrant/qdrant@sha256:75eab8c4ba42096724fdcfde8b4de0b5713d529dde32f285a1f86fdcb2c9e50c
    container_name: persona-vault-qdrant
    restart: unless-stopped
    volumes:
      - persona-vault-qdrant:/qdrant/storage

volumes:
  persona-vault-data:
  persona-vault-qdrant:
