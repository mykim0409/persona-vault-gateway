<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-labelledby="pv-icon-title pv-icon-desc">
  <title id="pv-icon-title">PersonaVault</title>
  <desc id="pv-icon-desc">A cairn of three hand-cut sediment stones, amber on terracotta on garnet, each showing its own layer, with two loose grains of raw evidence above that have not settled yet.</desc>
  <defs>
    <linearGradient id="pv-icon-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#25242F"/>
      <stop offset="1" stop-color="#15151C"/>
    </linearGradient>
    <clipPath id="pv-icon-s1"><path d="M28 88 C44 81 86 80 98 84 Q106 86 106 95 L105.5 101 Q105 110 96 110 L30 110.5 Q20 110.5 20 101 L20 96 Q20 89.5 28 88 Z"/></clipPath>
    <clipPath id="pv-icon-s2"><path d="M36 64 C50 59 80 59 87 62 Q95 64 95 71 L94.5 75 Q94 82 86 82 L37 82.5 Q28.5 82.5 28.5 75 L28.5 71 Q28.5 65 36 64 Z"/></clipPath>
    <clipPath id="pv-icon-s3"><path d="M49 42 C58 38 76 38 80 40 Q87 41.5 87 48 L86.5 52 Q86 58.5 79 58.5 L50 59 Q42.5 59 42.5 52.5 L42.5 48 Q42.5 43 49 42 Z"/></clipPath>
  </defs>
  <rect x="2" y="2" width="124" height="124" rx="28" fill="url(#pv-icon-bg)"/>
  <rect x="2.75" y="2.75" width="122.5" height="122.5" rx="27.25" fill="none" stroke="#F6EBD6" stroke-opacity="0.14" stroke-width="1.5"/>
  <!-- raw evidence: loose grains, not yet settled -->
  <rect x="45" y="17" width="11" height="11" rx="2.6" fill="#F4E7CC" transform="rotate(-14 50.5 22.5)"/>
  <rect x="67" y="23" width="9" height="9" rx="2.2" fill="#F4E7CC" fill-opacity="0.72" transform="rotate(18 71.5 27.5)"/>
  <!-- settled knowledge: base stone -->
  <g clip-path="url(#pv-icon-s1)">
    <rect x="16" y="76" width="96" height="40" fill="#A23E4F"/>
    <path d="M16 99 C40 95 74 103 110 97 L110 116 L16 116 Z" fill="#842F42"/>
  </g>
  <!-- middle stone -->
  <g transform="rotate(-2 62 72)" clip-path="url(#pv-icon-s2)">
    <rect x="24" y="54" width="76" height="34" fill="#DE7445"/>
    <path d="M24 74 C44 70 70 78 99 72 L99 88 L24 88 Z" fill="#BC5C36"/>
  </g>
  <!-- newest stone -->
  <g transform="rotate(3 64 49)" clip-path="url(#pv-icon-s3)">
    <rect x="38" y="34" width="54" height="30" fill="#F2B451"/>
    <path d="M38 51 C52 48 68 55 91 49 L91 64 L38 64 Z" fill="#D6963C"/>
  </g>
</svg>
